<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SlipSeend</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d10;
            color: #ffffff;
        }

        header {
            width: 100%;
            padding: 24px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #24282e;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
        }

        nav a {
            color: #d7d7d7;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: calc(100vh - 80px);
            padding: 80px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            max-width: 1100px;
            margin: auto;
        }

        .tag {
            padding: 8px 14px;
            border: 1px solid #343a40;
            border-radius: 30px;
            color: #b9c0c8;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 82px);
            line-height: 1;
            margin-bottom: 25px;
        }

        .descricao {
            font-size: 20px;
            color: #b9c0c8;
            line-height: 1.6;
            max-width: 700px;
            margin-bottom: 35px;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .botao {
            display: inline-block;
            padding: 16px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }

        .principal {
            background: #ffffff;
            color: #101216;
        }

        .secundario {
            border: 1px solid #444b55;
            color: #ffffff;
        }

        footer {
            padding: 35px 8%;
            text-align: center;
            color: #777f88;
            border-top: 1px solid #24282e;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SlipSeend</div>

    <nav>
        <a href="/download">Download</a>
    </nav>
</header>

<main class="hero">

    <div class="tag">
        SlipSeend para Windows
    </div>

    <h1>
        Automação simples.<br>
        Trabalho mais rápido.
    </h1>

    <p class="descricao">
        O SlipSeend foi desenvolvido para automatizar processos,
        organizar operações e tornar o trabalho diário mais rápido
        e eficiente.
    </p>

    <div class="botoes">

        <a class="botao principal" href="/download">
            Baixar SlipSeend
        </a>

        <a class="botao secundario" href="mailto:contato@slipseend.com.br">
            Falar com suporte
        </a>

    </div>

</main>

<footer>
    © 2026 SlipSeend. Todos os direitos reservados.
</footer>

</body>
</html>
