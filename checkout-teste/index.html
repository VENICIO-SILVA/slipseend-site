<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura SlipSeend</title>
</head>
<body>
    <p>
        O checkout foi atualizado.
        <a id="destino" href="/checkout/">Continuar para a assinatura SlipSeend</a>
    </p>

    <script>
        const destino = new URL('/checkout/', location.origin);
        const parametros = new URLSearchParams(location.search);

        for (const chave of ['plano', 'ciclo', 'assinatura']) {
            if (parametros.has(chave)) {
                destino.searchParams.set(chave, parametros.get(chave));
            }
        }

        document.getElementById('destino').href = destino.href;
        location.replace(destino.href);
    </script>
</body>
</html>
